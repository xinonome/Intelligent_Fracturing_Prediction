  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #f7f0e7;
      --ink: #271b12;
      --muted: #6a5a4e;
      --accent: #a55b2a;
      --accent-2: #2a4f72;
      --card: #fff7ee;
      --stroke: rgba(39, 27, 18, 0.14);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 18% 15%, #f7ead8, transparent 55%), radial-gradient(circle at 82% 12%, #e5eef4, transparent 55%), var(--bg);
      min-height: 100vh;
      padding: 28px;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(30, 27, 22, 0.12);
      border: 1px solid var(--stroke);
      overflow: hidden;
    }
    header {
      padding: 26px 28px 18px;
      border-bottom: 1px solid var(--stroke);
      background: linear-gradient(120deg, rgba(165, 91, 42, 0.12), rgba(42, 79, 114, 0.1));
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 1px;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(300px, 1.2fr) minmax(260px, 0.8fr);
      gap: 22px;
      padding: 24px 28px 30px;
    }
    #graph {
      height: 560px;
      border: 1px solid var(--stroke);
      border-radius: 16px;
      background: radial-gradient(circle at 14px 14px, rgba(39, 27, 18, 0.08) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .qa {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--stroke);
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    .preset {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .preset button {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      font-size: 14px;
    }
    .input-row button {
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #answer {
      margin: 0;
      white-space: pre-line;
      color: var(--ink);
      background: rgba(210, 106, 58, 0.08);
      padding: 12px;
      border-radius: 12px;
      min-height: 88px;
      border: 1px solid rgba(210, 106, 58, 0.25);
    }
    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
      #graph {
        height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>施工知识图谱与语义问答</h1>
      <p>以井号为主线，展开段号、施工情况与工况的层级关系，并提供每口井的统计问答。</p>
    </header>
    <section class="grid">
      <div id="graph"></div>
      <div class="qa">
        <div class="panel">
          <h2>语义问答</h2>
          <div class="preset" id="preset"></div>
        </div>
        <div class="panel">
          <div class="input-row">
            <input id="questionInput" placeholder="输入问题，例如：段号15砂比平均值是多少？" />
            <button id="askBtn">提问</button>
          </div>
          <p id="answer">在上方选择或输入问题。</p>
        </div>
      </div>
    </section>
  </div>

      const perWell = {};
      Object.entries(stats).forEach(([well, segments]) => {
        if (!segments || !segments[segmentId]) {
          perWell[well] = "无此段号";
          return;
        }
        const metricStats = segments[segmentId][metric];
        if (!metricStats || metricStats[statKey] === null) {
          perWell[well] = "无数据";
        } else {
          perWell[well] = metricStats[statKey];
        }
      });
      return formatPerWell(perWell);
    }

    function answer(question) {
      const normalized = (question || "").trim();
      const segmentMatch = normalized.match(
        /^段号\s*(\d+)\s*(砂比|排量|施工泵压)\s*(平均值|方差)是多少[？?]?$/
      );
      const output = document.getElementById("answer");
      if (segmentMatch) {
        const [, segmentId, metric, statType] = segmentMatch;
        output.textContent = answerSegmentQuestion(segmentId, metric, statType);
        return;
      }
      const match = QA_PRESETS.find((item) => item.question === normalized);
      if (match) {
        output.textContent = match.answer;
      } else {
        const list = QA_PRESETS.map((item) => item.question).join("；");
        output.textContent = `我目前不支持该类查询，你可以问我：${list}；例如：段号15砂比平均值是多少？`;
      }
    }

    document.getElementById("askBtn").addEventListener("click", () => {
      answer(document.getElementById("questionInput").value);
    });
  </script>
</body>
</html>
